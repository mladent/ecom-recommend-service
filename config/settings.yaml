# E-Commerce Recommendation Engine Configuration

# Data Processing
data:
  raw_file: data.csv
  processed_file: processed_data.pkl
  chunk_size: 10000
  
# Bundle Generation
bundles:
  min_support: 0.02
  min_confidence: 0.5
  max_bundle_size: 5
  
# Model Training
training:
  train_test_split: 0.8
  random_state: 42
  n_jobs: -1
  
# Algorithms
algorithms:
  naive_bayes:
    enabled: true
    model_type: multinomial
    
  svm:
    enabled: true
    kernel: linear
    C: 1.0
    
# Recommendation Parameters
recommendation:
  confidence_threshold: 0.5
  max_recommendations: 5
  ensemble_method: average
  
# Logging
logging:
  level: INFO
  file: recommendation_service.log
  
# LLM Normalization (cache-first)
normalization:
  enabled: false
  cache_first: true
  cache_path: data/normalization_cache.json
  alias_map_path: data/description_aliases.json
  min_length: 3
  llm:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.0
    max_tokens: 64
    timeout_seconds: 20
